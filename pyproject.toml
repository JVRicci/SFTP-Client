[tool.poetry]
name = "sftp client"
version = "0.1.0"
description = "SFTP client interface"
authors = ["JVvsRicci"]
readme = "README.md"

[tool.poetry.scripts]
sftp-client = "main:main"

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.34.2"
kivy = "^2.3.1"
pydantic = "^2.13.4"
sqlalchemy = "^2.0.51"
pysqlite3 = "^0.6.0"
loguru = "^0.7.3"
python-dotenv = "^1.2.2"
pathlib = "^1.0.1"
asyncio = "^4.0.0"
pytest = "^9.1.1"
pytest-mock = "^3.15.1"
pytest-cov = "^7.1.0"


[tool.poetry.group.dev.dependencies]
poethepoet = "^0.48.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
